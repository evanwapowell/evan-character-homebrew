# Publishes a release when module.json's version on main hasn't been released yet. Pushes to other branches, and
# pushes to main that don't bump the version, publish nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./module.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip versions that are already released
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is already released, so nothing was published. Bump the version in module.json to release changes to the module."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.released.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install the build tools
        if: steps.released.outputs.exists == 'false'
        run: npm ci

      - name: Check the module
        if: steps.released.outputs.exists == 'false'
        run: npm test

      - name: Build the compendium
        if: steps.released.outputs.exists == 'false'
        run: npm run build

      - name: Point the manifest at this release
        if: steps.released.outputs.exists == 'false'
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const url = process.env.REPOSITORY_URL;
            manifest.manifest = `${url}/releases/latest/download/module.json`;
            manifest.download = `${url}/releases/download/${manifest.version}/evan-character-homebrew.zip`;
            fs.writeFileSync("module.json", JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Package the module
        if: steps.released.outputs.exists == 'false'
        run: zip -r evan-character-homebrew.zip module.json packs/ scripts/ token-subjects/ animations/

      - name: Publish the release
        if: steps.released.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            module.json
            evan-character-homebrew.zip
